# Robot timing and odometry model for meshmerize-sim.
#
# Every number here is a PLACEHOLDER until measured on the real car.
# See README "Calibration" for the measuring procedure. Load it with
#   make compare ROBOT=robot.cfg      or     ./build/show --robot robot.cfg
#
# Units: mm, ms. Speeds are averages along a corridor, not peak speeds.

# Dry Run: driving slowly, reading the line carefully, stopping to think
dry.mm_per_s  = 500
dry.node_ms   = 300     # slowing down / deciding at every junction or dead end
dry.turn_ms   = 400     # extra for a 90 degree corner
dry.uturn_ms  = 1000    # extra for reversing out of a dead end

# Actual Run: the route is known, drive faster
run.mm_per_s  = 900
run.node_ms   = 250
run.turn_ms   = 300
run.uturn_ms  = 800

# Dead reckoning. With odom.enabled = 0 the explorer is told node ids by
# the simulator (an idealised robot). With 1 it has to recognise places
# from drifting positions, like the real one will.
odom.enabled   = 0
odom.scale_err = 0.02   # wheel calibration error: 0.02 = thinks it drove 2% further
odom.noise     = 0.01   # random error per move, up to this fraction of the distance
odom.merge_mm  = 100    # two positions closer than this are the same place
