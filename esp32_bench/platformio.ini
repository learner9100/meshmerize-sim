; ESP32 benchmark for the core/ code. NOT verified yet: nobody has flashed
; this. It is here so the first person with a board can start from
; something instead of nothing. Report back what happens.
;
;   cd esp32_bench && pio run -t upload && pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -I../core -I../sim
