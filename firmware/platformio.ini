; Robot firmware. Build and flash with PlatformIO:
;
;   cd firmware
;   pio run                 compile only
;   pio run -t upload       flash
;   pio device monitor      serial menu at 115200
;
; ../core is the same maze code the simulator runs. Nothing to install
; besides PlatformIO itself; it fetches the ESP32 toolchain on first use.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -I../core -I../sim -Wall -Wextra
